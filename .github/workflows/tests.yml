# Test su Windows, macOS e Linux: installa la toolchain GNU per ARM come farebbe
# uno studente, poi compila ed esegue nell'emulatore i programmi di prova e avvia
# e chiude il debugger completo (senza aprire il browser).
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Toolchain GNU per ARM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi

      - name: Toolchain GNU per ARM (macOS)
        if: runner.os == 'macOS'
        run: brew install arm-none-eabi-binutils

      # Su Windows la stessa Arm GNU Toolchain ufficiale indicata nel README
      - name: Toolchain GNU per ARM (Windows)
        if: runner.os == 'Windows'
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Dipendenze Python
        run: python -m pip install -r requirements.txt

      - name: Ricerca della toolchain
        run: python -m app.toolchain

      - name: Test
        env:
          ARM_GDK_NO_BROWSER: "1"
        run: python -m unittest discover -s tests -v
